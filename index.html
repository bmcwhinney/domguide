<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F8F8F8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Bmac's curated shortguide to Dominica — beaches, hikes, food, nightlife, map, and local contacts.">
<title>Bmac's shortguide to Dominica 🇩🇲</title>

<!-- Leaflet CSS & JS for the Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  :root {
    --bg-base: #F8F8F8;
    --bg-surface: #FFFFFF;
    --bg-surface-hover: #FFFFFF;

    --text-primary: #1C1C1C;
    --text-secondary: #5C5C5C;
    --text-tertiary: #888888;
    --border-color: rgba(0, 0, 0, 0.1);

    --accent: #2C2C2C;
    --accent-light: #444444;
    --tag-bg: #EEEEEE;
    --tag-text: #444444;
    --marker-color: #555555;
    --tip-bg: #F3F3F3;
    --tip-border: #DDDDDD;

    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.08);
    --shadow-float: 0 4px 16px rgba(0, 0, 0, 0.1);

    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    
    /* Layout */
    --space-xs: 0.5rem;
    --space-sm: 1rem;
    --space-md: 1.5rem;
    --space-lg: 3rem;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --nav-mobile-height: 3.75rem;
    --mobile-header-h: 7.75rem;
    --mobile-bottom-h: 6.75rem;
    
    /* Curves */
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --transition-fast: 0.2s var(--ease-out-expo);
    --transition-smooth: 0.4s var(--ease-out-expo);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scroll-behavior: smooth;
  }
  
  body { 
    overflow-x: clip;
    background-color: var(--bg-base);
    color: var(--text-primary); 
    font-family: var(--font-sans); 
    -webkit-font-smoothing: antialiased; 
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.6;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0.08);
  }

  /* Core Layout Grid */
  .layout-wrapper {
    display: grid;
    grid-template-columns: 1fr;
    min-height: 100vh;
    max-width: 1280px;
    margin: 0 auto;
  }

  /* Header & Branding */
  .brand-header {
    padding: calc(var(--space-md) + var(--safe-top)) var(--space-md) var(--space-sm);
    text-align: center;
  }

  .brand-title {
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 0.35rem;
    color: var(--text-primary);
    line-height: 1.15;
    text-wrap: balance;
    hyphens: auto;
  }

  .brand-meta {
    font-size: clamp(0.875rem, 2.8vw, 0.95rem);
    font-weight: 400;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    line-height: 1.5;
    text-wrap: pretty;
    max-width: 28rem;
    margin: 0 auto;
  }

  /* ── Mobile app shell (hidden on desktop) ── */
  .mobile-header,
  .mobile-bottom-nav,
  .section-sheet {
    display: none;
  }

  .mobile-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(248, 248, 248, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-color);
    padding: calc(0.5rem + var(--safe-top)) max(1rem, var(--safe-right)) 0.65rem max(1rem, var(--safe-left));
  }

  .mobile-header-top {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }

  .mobile-brand-text {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  .mobile-section-trigger {
    width: 100%;
    text-align: left;
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 0.85rem 1rem;
    cursor: pointer;
    touch-action: manipulation;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 0.15rem 0.5rem;
    align-items: center;
  }

  .mobile-section-trigger:active {
    transform: scale(0.98);
    background: var(--tag-bg);
  }

  .mobile-section-current {
    font-size: 1.0625rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.2;
    grid-column: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  .mobile-section-hint {
    font-size: 0.75rem;
    color: var(--text-tertiary);
    grid-column: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mobile-section-chevron {
    grid-column: 2;
    grid-row: 1 / span 2;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--tag-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 0.7rem;
    font-weight: 700;
  }

  .mobile-bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-color);
    padding: 0.5rem max(0.75rem, var(--safe-right)) calc(0.5rem + var(--safe-bottom)) max(0.75rem, var(--safe-left));
    grid-template-columns: 1fr auto 1fr;
    grid-template-rows: auto auto;
    align-items: center;
    gap: 0.35rem 0.5rem;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.06);
  }

  .mobile-nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.2rem;
    min-height: 48px;
    padding: 0.35rem 0.5rem;
    border: none;
    background: transparent;
    font-family: var(--font-sans);
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-secondary);
    border-radius: 12px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .mobile-nav-btn:disabled {
    opacity: 0.35;
    pointer-events: none;
  }

  .mobile-nav-btn:active:not(:disabled) {
    background: var(--tag-bg);
    color: var(--accent);
  }

  .mobile-nav-btn .nav-icon {
    font-size: 1.25rem;
    line-height: 1;
  }

  .mobile-nav-primary {
    background: var(--accent);
    color: #fff;
    border-radius: 14px;
    padding: 0.65rem 1.25rem;
    font-size: 0.8125rem;
    font-weight: 600;
    min-height: 48px;
    flex-direction: row;
    gap: 0.4rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  }

  .mobile-nav-primary:active {
    background: var(--accent-light);
    color: #fff;
  }

  .mobile-nav-counter {
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--text-tertiary);
    text-align: center;
    grid-column: 1 / -1;
    grid-row: 2;
    margin-top: 0;
  }

  .mobile-nav-btn:focus-visible,
  .mobile-section-trigger:focus-visible,
  .sheet-section-btn:focus-visible,
  .nav-btn:focus-visible {
    outline: 2px solid var(--accent-light);
    outline-offset: 2px;
  }

  /* Section picker sheet */
  .section-sheet {
    position: fixed;
    inset: 0;
    z-index: 200;
    pointer-events: none;
    visibility: hidden;
    transition: visibility 0.3s;
  }

  .section-sheet.open {
    pointer-events: auto;
    visibility: visible;
  }

  .section-sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(26, 36, 33, 0.45);
    opacity: 0;
    transition: opacity 0.35s var(--ease-out-expo);
  }

  .section-sheet.open .section-sheet-backdrop {
    opacity: 1;
  }

  .section-sheet-panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 85dvh;
    background: var(--bg-base);
    border-radius: 20px 20px 0 0;
    padding: 0.75rem 1rem calc(1.25rem + var(--safe-bottom));
    transform: translateY(100%);
    transition: transform 0.4s var(--ease-out-expo);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -20px 60px rgba(0,0,0,0.15);
  }

  .section-sheet.open .section-sheet-panel {
    transform: translateY(0);
  }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: rgba(0, 0, 0, 0.15);
    border-radius: 99px;
    margin: 0 auto 1rem;
    flex-shrink: 0;
  }

  .sheet-title {
    font-size: 1.125rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 1rem;
    flex-shrink: 0;
  }

  .section-sheet-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding-bottom: 0.5rem;
  }

  .sheet-section-btn {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    width: 100%;
    text-align: left;
    padding: 0.9rem 1rem;
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.15s, border-color 0.15s;
  }

  .sheet-section-btn:active {
    background: var(--tag-bg);
  }

  .sheet-section-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .sheet-section-btn.active .sheet-label,
  .sheet-section-btn.active .sheet-count {
    color: #fff;
  }

  .sheet-section-btn.active .sheet-count {
    background: rgba(255,255,255,0.2);
  }

  .sheet-icon {
    font-size: 1.5rem;
    width: 2.25rem;
    text-align: center;
    flex-shrink: 0;
  }

  .sheet-label-wrap {
    flex: 1;
    min-width: 0;
  }

  .sheet-label {
    display: block;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.2;
  }

  .sheet-sublabel {
    display: block;
    font-size: 0.75rem;
    color: var(--text-tertiary);
    margin-top: 0.15rem;
  }

  .sheet-section-btn.active .sheet-sublabel {
    color: rgba(255,255,255,0.75);
  }

  .sheet-count {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent);
    background: var(--tag-bg);
    padding: 0.25rem 0.6rem;
    border-radius: 99px;
    flex-shrink: 0;
  }

  body.sheet-open {
    overflow: hidden;
  }

  /* Navigation (Desktop sidebar) */
  .nav-container {
    background: rgba(248, 248, 248, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 90;
    margin-bottom: var(--space-md);
    padding-top: var(--safe-top);
  }

  .nav-scroll-wrap {
    position: relative;
    overflow: hidden;
  }

  .nav-scroll-wrap::before,
  .nav-scroll-wrap::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1.75rem;
    z-index: 2;
    pointer-events: none;
  }

  .nav-scroll-wrap::before {
    left: 0;
    background: linear-gradient(to right, rgba(248, 248, 248, 0.98), transparent);
  }

  .nav-scroll-wrap::after {
    right: 0;
    background: linear-gradient(to left, rgba(248, 248, 248, 0.98), transparent);
  }

  .nav-list {
    display: flex;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding: var(--space-sm) var(--space-md);
    gap: 0.5rem;
    touch-action: pan-x;
  }
  
  .nav-list::-webkit-scrollbar { display: none; }

  .nav-item {
    scroll-snap-align: start;
    flex-shrink: 0;
  }

  .nav-btn {
    background: transparent;
    border: 1px solid transparent;
    padding: 0.65rem 1.25rem;
    min-height: 44px;
    font-family: var(--font-sans);
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-secondary);
    border-radius: 99px;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: flex;
    align-items: center;
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  @media (hover: hover) and (pointer: fine) {
    .nav-btn:hover { 
      color: var(--accent); 
      background: rgba(0, 0, 0, 0.04);
    }
  }
  
  .nav-btn.active {
    background: var(--accent);
    color: #FFFFFF;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  }

  @media (hover: hover) and (pointer: fine) {
    .nav-btn.active {
      transform: scale(1.02);
    }
  }

  /* Main Content Area */
  .content-area {
    padding: 0 var(--space-md) var(--space-md);
    padding-bottom: calc(var(--space-lg) + var(--safe-bottom));
    scroll-margin-top: calc(var(--nav-mobile-height) + var(--safe-top) + 0.5rem);
  }

  .section-header {
    margin-bottom: var(--space-lg);
    animation: slideDownFade 0.6s var(--ease-out-expo) forwards;
    scroll-margin-top: calc(var(--nav-mobile-height) + var(--safe-top) + 0.5rem);
  }

  .section-theme {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
    display: inline-block;
    background: var(--tag-bg);
    padding: 0.3rem 0.8rem;
    border-radius: 6px;
  }

  .section-title {
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 600;
    line-height: 1.12;
    color: var(--text-primary);
    margin-top: 0.5rem;
    text-wrap: balance;
  }

  /* Activity List Framework */
  .activity-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-md);
  }

  .activity-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 1.5rem;
    box-shadow: var(--shadow-sm);
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  /* Styling adjustment for tip cards */
  .activity-card.card-tip {
    background: var(--tip-bg);
    border: 1px dashed var(--tip-border);
    box-shadow: none;
  }

  @media (hover: hover) and (pointer: fine) {
    .activity-card:hover {
      border-color: rgba(0, 0, 0, 0.18);
      box-shadow: var(--shadow-md);
    }
  }

  @media (hover: hover) and (pointer: fine) {
    .activity-card:active {
      transform: scale(0.995);
      transition-duration: 0.1s;
    }
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .act-title {
    font-size: 1.125rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.2;
  }

  .act-tag {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.35rem 0.75rem;
    background: var(--tag-bg);
    border-radius: var(--radius-sm);
    color: var(--tag-text);
    white-space: nowrap;
    border: 1px solid var(--border-color);
  }

  .act-desc {
    font-size: 1rem;
    color: var(--text-secondary);
    line-height: 1.65;
    flex-grow: 1;
    font-weight: 400;
    overflow-wrap: break-word;
  }

  .act-desc a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(0, 0, 0, 0.2);
    transition: all var(--transition-fast);
    padding: 0.15em 0.1em 0.2em;
    margin: -0.15em -0.1em;
    border-radius: 2px;
    touch-action: manipulation;
  }

  @media (hover: hover) and (pointer: fine) {
    .act-desc a:hover {
      border-bottom-color: var(--accent);
      background: rgba(0, 0, 0, 0.04);
    }
  }

  /* Map Container & Custom Leaflet Overrides */
  #map-container {
    height: 75vh;
    min-height: 500px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--border-color);
    position: relative;
    z-index: 1; 
    box-shadow: var(--shadow-md);
    transition: box-shadow var(--transition-smooth);
    animation: scaleUpFade 0.7s var(--ease-out-expo) forwards;
  }
  
  @media (hover: hover) and (pointer: fine) {
    #map-container:hover {
      box-shadow: var(--shadow-float);
    }
  }
  
  .leaflet-container {
    font-family: var(--font-sans) !important;
  }
  
  .leaflet-popup-content-wrapper {
    border-radius: 12px !important;
    box-shadow: var(--shadow-md) !important;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.95) !important;
  }
  
  .leaflet-popup-content {
    margin: 16px 20px !important;
  }

  .custom-map-marker {
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.2s ease;
  }
  
  @media (hover: hover) and (pointer: fine) {
    .custom-map-marker:hover {
      transform: scale(1.15);
      z-index: 1000 !important;
    }
  }

  .map-error {
    padding: 2rem;
    text-align: center;
    color: var(--text-secondary);
    background: var(--tag-bg);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
  }

  /* Cascading Animations */
  .stagger-item {
    opacity: 0;
    transform: translateY(20px);
    animation: slideUpFade 0.6s var(--ease-out-expo) forwards;
  }

  @keyframes slideUpFade {
    to { opacity: 1; transform: translateY(0); }
  }
  
  @keyframes slideDownFade {
    from { opacity: 0; transform: translateY(-15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes scaleUpFade {
    from { opacity: 0; transform: scale(0.98) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .stagger-item,
    .section-header,
    #map-container,
    .section-sheet-panel,
    .section-sheet-backdrop {
      animation: none;
      transition: none;
      opacity: 1;
      transform: none;
    }
    .section-sheet.open .section-sheet-panel {
      transform: translateY(0);
    }
    .activity-card,
    .nav-btn,
    .nav-btn.active,
    .mobile-section-trigger {
      transition: none;
    }
    .mobile-section-trigger:active {
      transform: none;
    }
  }

  /* ── Mobile layout (app-style) ── */
  @media (max-width: 899px) {
    :root {
      --space-md: 1rem;
      --space-lg: 1.5rem;
    }

    .brand-header,
    .nav-container {
      display: none !important;
    }

    .mobile-header {
      display: block;
    }

    .mobile-bottom-nav {
      display: grid;
    }

    .section-sheet {
      display: block;
    }

    .section-count,
    .map-hint {
      display: block;
    }

    .layout-wrapper {
      min-height: auto;
    }

    html {
      scroll-padding-bottom: calc(var(--mobile-bottom-h) + var(--safe-bottom) + 1rem);
    }

    .content-area {
      padding-left: max(1rem, var(--safe-left));
      padding-right: max(1rem, var(--safe-right));
      padding-bottom: calc(var(--mobile-bottom-h) + var(--safe-bottom) + 2rem);
      scroll-margin-top: calc(var(--mobile-header-h) + var(--safe-top));
    }

    .scroll-spacer {
      display: block;
      height: 0.5rem;
      flex-shrink: 0;
    }

    .section-header {
      margin-bottom: 1rem;
      padding-top: 0.25rem;
      animation: none;
      opacity: 1;
      transform: none;
    }

    .section-theme {
      font-size: 0.6875rem;
      padding: 0.25rem 0.65rem;
    }

    .section-title {
      font-size: 1.5rem;
      margin-top: 0.35rem;
    }

    .section-count {
      display: inline-block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-tertiary);
      margin-top: 0.35rem;

let activeIndex = 0;
let mapInstance = null;
let listenersBound = false;
let sheetTrigger = null;

const navContainer = document.getElementById('navContainer');
const contentContainer = document.getElementById('contentContainer');
const sectionSheet = document.getElementById('sectionSheet');
const sectionSheetList = document.getElementById('sectionSheetList');
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sectionSheetPanel = document.getElementById('sectionSheetPanel');
const openSectionsBtn = document.getElementById('openSectionsBtn');
const openSectionsBtnBottom = document.getElementById('openSectionsBtnBottom');
const mobileCurrentSection = document.getElementById('mobileCurrentSection');
const mobileCurrentTheme = document.getElementById('mobileCurrentTheme');
const sectionCounter = document.getElementById('sectionCounter');
const prevSectionBtn = document.getElementById('prevSection');
const nextSectionBtn = document.getElementById('nextSection');

function isMobileView() {
  return window.matchMedia('(max-width: 899px)').matches;
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function isSafeUrl(url) {
  try {
    const u = new URL(url);
    return u.protocol === 'https:' || u.protocol === 'http:';
  } catch {
    return false;
  }
}

function formatDesc(desc, link) {
  let html = escapeHtml(desc);
  html = html.replace(/(\+1-767-\d{3}-\d{4})/g, (phone) => {
    const digits = phone.replace(/\D/g, '');
    return `<a class="act-phone" href="tel:+${digits}">📞 ${escapeHtml(phone)}</a>`;
  });
  if (link && link.url && link.label && isSafeUrl(link.url)) {
    html += ` <a class="act-link" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.label)}</a>`;
  }
  return html;
}

function destroyMap() {
  if (mapInstance) {
    mapInstance.remove();
    mapInstance = null;
  }
}

function init() {
  bindListeners();
  renderNav();
  renderSectionSheet();
  renderContent();
  updateMobileChrome();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(updateMobileChromeHeights);
  }
  window.addEventListener('load', updateMobileChromeHeights);
}

function bindListeners() {
  if (listenersBound) return;
  listenersBound = true;

  navContainer.addEventListener('click', (e) => {
    const btn = e.target.closest('.nav-btn');
    if (btn && btn.dataset.index != null) switchTab(Number(btn.dataset.index));
  });

  navContainer.addEventListener('keydown', (e) => {
    if (!e.target.closest('.nav-btn')) return;
    let next = activeIndex;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      e.preventDefault();
      next = Math.min(activeIndex + 1, data.length - 1);
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      e.preventDefault();
      next = Math.max(activeIndex - 1, 0);
    } else if (e.key === 'Home') {
      e.preventDefault();
      next = 0;
    } else if (e.key === 'End') {
      e.preventDefault();
      next = data.length - 1;
    } else {
      return;
    }
    if (next !== activeIndex) switchTab(next);
  });

  [openSectionsBtn, openSectionsBtnBottom].forEach((btn) => {
    btn.addEventListener('click', openSectionSheet);
  });

  sheetBackdrop.addEventListener('click', closeSectionSheet);

  prevSectionBtn.addEventListener('click', () => switchTab(activeIndex - 1));
  nextSectionBtn.addEventListener('click', () => switchTab(activeIndex + 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sectionSheet.classList.contains('open')) {
      closeSectionSheet();
      sheetTrigger?.focus();
    }
  });
}

function renderSectionSheet() {
  sectionSheetList.innerHTML = data.map((item, index) => {
    const count = item.activities ? item.activities.length : (item.isMap ? 'Map' : '');
    const countLabel = typeof count === 'number' ? `${count} spots` : count;
    return `
      <button type="button" class="sheet-section-btn ${index === activeIndex ? 'active' : ''}" data-index="${index}">
        <span class="sheet-icon" aria-hidden="true">${item.icon || '📍'}</span>
        <span class="sheet-label-wrap">
          <span class="sheet-label">${escapeHtml(item.label)}</span>
          <span class="sheet-sublabel">${escapeHtml(item.theme)}</span>
        </span>
        ${countLabel ? `<span class="sheet-count">${escapeHtml(String(countLabel))}</span>` : ''}
      </button>
    `;
  }).join('');

  sectionSheetList.querySelectorAll('.sheet-section-btn').forEach((btn) => {
    btn.addEventListener('click', () => switchTab(Number(btn.dataset.index)));
  });
}

function updateMobileChromeHeights() {
  const root = document.documentElement;
  if (!isMobileView()) {
    root.style.removeProperty('--mobile-bottom-h');
    root.style.removeProperty('--mobile-header-h');
    return;
  }
  const nav = document.getElementById('mobileBottomNav');
  const header = document.getElementById('mobileHeader');
  if (nav) root.style.setProperty('--mobile-bottom-h', `${nav.offsetHeight}px`);
  if (header) root.style.setProperty('--mobile-header-h', `${header.offsetHeight}px`);
}

function updateMobileChrome() {
  const section = data[activeIndex];
  mobileCurrentSection.textContent = section.title;
  const spots = section.activities?.length;
  mobileCurrentTheme.textContent = spots
    ? `${section.theme} · ${spots} spots — tap to change`
    : `${section.theme} — tap to change`;
  sectionCounter.textContent = `${activeIndex + 1} of ${data.length}`;
  prevSectionBtn.disabled = activeIndex === 0;
  nextSectionBtn.disabled = activeIndex === data.length - 1;
  renderSectionSheet();
  requestAnimationFrame(updateMobileChromeHeights);
}

function openSectionSheet() {
  sheetTrigger = document.activeElement;
  sectionSheet.classList.add('open');
  sectionSheet.setAttribute('aria-hidden', 'false');
  sectionSheetPanel.inert = false;
  openSectionsBtn.setAttribute('aria-expanded', 'true');
  document.body.classList.add('sheet-open');
  const active = sectionSheetList.querySelector('.sheet-section-btn.active');
  (active || sectionSheetList.querySelector('.sheet-section-btn'))?.focus();
}

function closeSectionSheet() {
  sectionSheet.classList.remove('open');
  sectionSheet.setAttribute('aria-hidden', 'true');
  sectionSheetPanel.inert = true;
  openSectionsBtn.setAttribute('aria-expanded', 'false');
  document.body.classList.remove('sheet-open');
}

function renderNav() {
  navContainer.innerHTML = data.map((item, index) => `
    <div class="nav-item" role="presentation">
      <button 
        type="button"
        role="tab"
        class="nav-btn ${index === activeIndex ? 'active' : ''}" 
        data-index="${index}"
        aria-selected="${index === activeIndex ? 'true' : 'false'}"
        aria-controls="contentContainer"
        id="nav-tab-${index}"
        tabindex="${index === activeIndex ? '0' : '-1'}"
      >
        ${escapeHtml(item.label)}
      </button>
    </div>
  `).join('');
}

function initMap() {
  const container = document.getElementById('map-container');
  if (!container) return;

  if (typeof L === 'undefined') {
    container.innerHTML = '<p class="map-error">Map could not load. Check your connection and refresh.</p>';
    return;
  }

  destroyMap();

  mapInstance = L.map(container, { tapTolerance: 15 }).setView([15.45, -61.3705], 11);
  
  // Minimalist, slightly warm base map layer
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(mapInstance);

  const customIcon = L.divIcon({
    className: 'custom-map-marker',
    html: `<div style="background-color: var(--marker-color); width: 16px; height: 16px; border-radius: 50%; border: 3px solid #FFF; box-shadow: 0 4px 10px rgba(0,0,0,0.3);"></div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });

  // Exhaustive list of all itinerary coordinates
  const locations = [
    // Portsmouth & North West
    { name: "Portsmouth / Saturday Market", type: "Hub", coords: [15.5786, -61.4552] },
    { name: "Indian River", type: "Nature", coords: [15.5683, -61.4552] },
    { name: "Cabrits Nat. Park / Intercontinental", type: "Heritage", coords: [15.5861, -61.4725] },
    { name: "Purple Turtle Beach", type: "Beach", coords: [15.5843, -61.4619] },
    { name: "Bell Hall Beach", type: "Beach / Evening", coords: [15.5975, -61.4646] },
    { name: "Coconut Beach & Whale Watching Base", type: "Beach / Marine", coords: [15.5627, -61.4654] },
    { name: "Secret Bay & Bwa Denn", type: "Upscale Dining", coords: [15.5606, -61.4667] },
    { name: "Toucari Bay & Keepin' It Real", type: "Snorkel & Food", coords: [15.6105, -61.4651] },
    { name: "Manoes Cornerstone", type: "Nightlife", coords: [15.6033, -61.4489] },
    { name: "Syndicate Falls", type: "Hike", coords: [15.5186, -61.4172] },
    
    // North / North East (Calibishie area)
    { name: "Red Rocks (Calibishie Day)", type: "Day Trip", coords: [15.5925, -61.3503] },
    { name: "Pointe Baptiste Chocolate Factory", type: "Food", coords: [15.5922, -61.3411] },
    { name: "Batibou Beach", type: "Beach", coords: [15.5919, -61.3789] },
    { name: "Douglas-Charles Airport", type: "Logistics", coords: [15.5461, -61.3006] },

    // Central & East Coast
    { name: "Kalinago Territory", type: "Heritage", coords: [15.4795, -61.2647] },
    { name: "Emerald Pool", type: "Swim", coords: [15.3970, -61.3125] },
    { name: "Zeb Zepis Bistro (Pont Cassé)", type: "Dining", coords: [15.3781, -61.3512] },
    
    // West Coast
    { name: "Mero Beach", type: "Beach", coords: [15.4334, -61.4287] },
    
    // Roseau & Surrounding South
    { name: "Roseau / Lacou / Roots Rock", type: "Dining & Nightlife", coords: [15.3017, -61.3880] },
    { name: "Roseau Bayfront", type: "Nightlife", coords: [15.2970, -61.3890] },
    { name: "Botanical Gardens", type: "Nature & Food", coords: [15.2995, -61.3820] },
    { name: "The Old Oven Art Gallery", type: "Art", coords: [15.2975, -61.3886] },
    { name: "Champagne Reef", type: "Marine", coords: [15.2444, -61.3731] },
    { name: "Soufriere & Scotts Head", type: "Day Trip", coords: [15.2136, -61.3686] },

    // Roseau Valley (Hot Springs & Hikes)
    { name: "Wotten Waven & Goodvibes Only", type: "Wellness / Food", coords: [15.3333, -61.3500] },
    { name: "Trafalgar Falls", type: "Nature", coords: [15.3267, -61.3350] },
    { name: "Titou Gorge", type: "Swim", coords: [15.3300, -61.3253] },
    { name: "Boeri Lake", type: "Hike", coords: [15.3489, -61.3147] },
    { name: "Boiling Lake", type: "Trek", coords: [15.3160, -61.2945] }
  ];

  locations.forEach((loc) => {
    L.marker(loc.coords, { icon: customIcon })
      .bindPopup(
        `<div style="font-family: var(--font-sans); max-width: 220px;">
          <strong style="font-size: 1rem; color: var(--text-primary); font-weight: 600; line-height: 1.3; display:block;">${escapeHtml(loc.name)}</strong>
          <span style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); margin-top:6px; display:inline-block;">${escapeHtml(loc.type)}</span>
        </div>`,
        { maxWidth: 260, autoPanPaddingTopLeft: [24, 24], autoPanPaddingBottomRight: [24, isMobileView() ? 100 : 24] }
      )
      .addTo(mapInstance);
  });

  requestAnimationFrame(() => {
    mapInstance?.invalidateSize();
  });
}

let mapResizeTimer;
function handleMapResize() {
  if (!mapInstance) return;
  clearTimeout(mapResizeTimer);
  mapResizeTimer = setTimeout(() => mapInstance.invalidateSize(), 150);
}

window.addEventListener('resize', () => {
  handleMapResize();
  updateMobileChromeHeights();
  if (!isMobileView()) closeSectionSheet();
});
window.addEventListener('orientationchange', handleMapResize);

function renderContent() {
  const section = data[activeIndex];
  contentContainer.setAttribute('aria-labelledby', `nav-tab-${activeIndex}`);
  contentContainer.setAttribute('aria-label', section.title);

  destroyMap();
  contentContainer.innerHTML = '';

  if (section.isMap) {
    contentContainer.innerHTML = `
      <div class="section-header">
        <div class="section-theme">${escapeHtml(section.theme)}</div>
        <h2 class="section-title">${escapeHtml(section.title)}</h2>
        <p class="section-count">Tap markers for details</p>
      </div>
      <div id="map-container" role="application" aria-label="Interactive map of Dominica"></div>
      <p class="map-hint">Pinch to zoom · Tap a marker for the spot name</p>
      <div class="scroll-spacer" aria-hidden="true"></div>
    `;

    requestAnimationFrame(() => {
      setTimeout(() => {
        initMap();
        setTimeout(() => {
          handleMapResize();
          updateMobileChromeHeights();
        }, 200);
      }, 50);
    });
    return;
  }

  const count = section.activities.length;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cardsHtml = section.activities.map((act, idx) => `
    <article class="activity-card stagger-item ${act.isTip ? 'card-tip' : ''}" data-type="${escapeHtml(act.type)}">
      <div class="card-header">
        <h3 class="act-title">${escapeHtml(act.title)}</h3>
        <span class="act-tag">${escapeHtml(act.type)}</span>
      </div>
      <p class="act-desc">${formatDesc(act.desc, act.link)}</p>
    </article>
  `).join('');

  contentContainer.innerHTML = `
    <div class="section-header">
      <div class="section-theme">${escapeHtml(section.theme)}</div>
      <h2 class="section-title">${escapeHtml(section.title)}</h2>
      <p class="section-count">${count} ${count === 1 ? 'spot' : 'spots'}</p>
    </div>
    <div class="activity-list">
      ${cardsHtml}
    </div>
    <div class="scroll-spacer" aria-hidden="true"></div>
  `;

  if (!reducedMotion && !isMobileView()) {
    contentContainer.querySelectorAll('.stagger-item').forEach((el, idx) => {
      el.style.animationDelay = `${idx * 0.08}s`;
    });
  }

  requestAnimationFrame(updateMobileChromeHeights);
}

function switchTab(index) {
  if (index < 0 || index >= data.length) return;
  if (index === activeIndex) {
    closeSectionSheet();
    return;
  }
  activeIndex = index;
  renderNav();
  renderContent();
  updateMobileChrome();
  closeSectionSheet();

  navContainer.querySelectorAll('.nav-btn').forEach((btn, i) => {
    btn.setAttribute('tabindex', i === activeIndex ? '0' : '-1');
  });

  const scrollBehavior = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  window.scrollTo({ top: 0, behavior: scrollBehavior });

  if (isMobileView()) {
    contentContainer.focus({ preventScroll: true });
  }
}

init();
</script>

</body>
</html>
